version: '3.8'

services:
  # ============================================================
  # 1. 核心关系型数据库 MySQL 8.4
  # ============================================================
  mysql:
    image: mysql:8.4
    container_name: knowledge-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "root123456"
      MYSQL_DATABASE: "knowledge_db"
      TZ: "Asia/Shanghai"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # 2. 高性能分布式缓存 Redis 7
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: knowledge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # 3. 消息队列中枢 RabbitMQ 3 (带 Web 管理后台: 15672)
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: knowledge-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP 协议通信端口
      - "15672:15672"   # Management Web 控制台管理端口 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 4. 向量与关系型数据库 PostgreSQL 16 (支持向量检索扩展)
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: knowledge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres123456"
      POSTGRES_DB: "knowledge_vector_db"
      TZ: "Asia/Shanghai"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_vector_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  postgres-data:
