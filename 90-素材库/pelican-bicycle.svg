<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" height="100%">
  <defs>
    <style>
      .stroke-main { stroke: #293E46; stroke-linecap: round; stroke-linejoin: round; }
      .bike-frame { stroke: #168E88; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- ================= 1. 画布背景 ================= -->
  <rect width="960" height="720" rx="28" fill="#FFF8E9" />

  <!-- ================= 2. 远景：云朵与太阳 ================= -->
  <!-- 左云 -->
  <path d="M 104 160 L 254 160 C 254 146 242 135 228 135 C 225 118 206 105 186 105 C 168 105 152 115 146 128 C 140 125 133 124 125 124 C 111 124 104 138 104 160 Z" fill="#FFFDF6" />

  <!-- 太阳 (正圆，被大嘴自然遮挡) -->
  <circle cx="755" cy="150" r="63.5" fill="#FFDC81" />

  <!-- 右云 (太阳左上方) -->
  <path d="M 610 88 L 722 88 C 722 78 714 70 702 70 C 696 59 682 54 670 54 C 656 54 644 63 640 73 C 634 71 626 71 620 77 C 612 81 610 88 610 88 Z" fill="#FFFDF6" />

  <!-- ================= 3. 地面、小草与速度线 ================= -->
  <!-- 地面水平细横线 -->
  <line x1="112" y1="605" x2="848" y2="605" stroke="#C5C4A8" stroke-width="3" stroke-linecap="round" />

  <!-- 地面长条扁平阴影 -->
  <ellipse cx="480" cy="605" rx="335" ry="9.5" fill="#E8DFC9" />

  <!-- 左侧小草 (位于 122, 590) -->
  <g stroke="#B4C4BE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 122 603 Q 120 588 114 578" />
    <path d="M 120 592 Q 130 582 136 584" />
  </g>

  <!-- 右侧小草 (位于 828, 590) -->
  <g stroke="#B4C4BE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 828 603 Q 826 588 820 578" />
    <path d="M 826 592 Q 836 582 842 584" />
  </g>

  <!-- 速度风线 (3 条水平线，位于尾羽后方) -->
  <g stroke="#B4C4BE" stroke-width="3.5" stroke-linecap="round">
    <line x1="210" y1="306" x2="278" y2="306" />
    <line x1="174" y1="332" x2="249" y2="332" />
    <line x1="216" y1="357" x2="259" y2="357" />
  </g>

  <!-- ================= 4. 自行车：车轮（后轮与前轮） ================= -->
  <!-- 后轮 (圆心: 281.3, 491.4) -->
  <g id="backWheel">
    <!-- 外胎深青黑圈 -->
    <circle cx="281.3" cy="491.4" r="110" fill="none" stroke="#293E46" stroke-width="13" />
    <!-- 轮圈内白色填充与内线 -->
    <circle cx="281.3" cy="491.4" r="96" fill="#FFFDF6" stroke="#293E46" stroke-width="3" />
    <!-- 辐条 6 根 (3 条直径) -->
    <g stroke="#B4C4BE" stroke-width="2.5">
      <line x1="281.3" y1="395.4" x2="281.3" y2="587.4" />
      <line x1="198.2" y1="443.4" x2="364.4" y2="539.4" />
      <line x1="198.2" y1="539.4" x2="364.4" y2="443.4" />
    </g>
    <!-- 后轮轴心黑点 -->
    <circle cx="281.3" cy="491.4" r="9.5" fill="#293E46" />
  </g>

  <!-- 前轮 (圆心: 689.7, 491.4) -->
  <g id="frontWheel">
    <!-- 外胎深青黑圈 -->
    <circle cx="689.7" cy="491.4" r="110" fill="none" stroke="#293E46" stroke-width="13" />
    <!-- 轮圈内白色填充与内线 -->
    <circle cx="689.7" cy="491.4" r="96" fill="#FFFDF6" stroke="#293E46" stroke-width="3" />
    <!-- 辐条 6 根 (3 条直径) -->
    <g stroke="#B4C4BE" stroke-width="2.5">
      <line x1="689.7" y1="395.4" x2="689.7" y2="587.4" />
      <line x1="606.6" y1="443.4" x2="772.8" y2="539.4" />
      <line x1="606.6" y1="539.4" x2="772.8" y2="443.4" />
    </g>
    <!-- 前轮轴心黑点 -->
    <circle cx="689.7" cy="491.4" r="9.5" fill="#293E46" />
  </g>

  <!-- ================= 5. 远处腿 (背光暗暖橙色，踩在车架后侧) ================= -->
  <g id="farLeg">
    <path d="M 473.5 368 L 494 367.5 L 517.5 395 Q 519 398 517.5 401 L 479 452.5 L 468.5 441 L 499.5 398 Z" 
          fill="#BD762D" stroke="#293E46" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ================= 6. 自行车车架管路 (高保真 7 根绿色直管) ================= -->
  <g id="bikeFrame" class="bike-frame">
    <!-- 1. 水平后下叉 -->
    <line x1="281.3" y1="491.4" x2="453.2" y2="491.4" />
    <!-- 2. 后上叉 -->
    <line x1="281.3" y1="491.4" x2="362" y2="362" />
    <!-- 3. 立管 -->
    <line x1="453.2" y1="491.4" x2="362" y2="362" />
    <!-- 4. 后斜支撑管 (与立管交叉) -->
    <line x1="281.3" y1="491.4" x2="446" y2="362" />
    <!-- 5. 水平上管 (贯穿腹下) -->
    <line x1="362" y1="362" x2="632" y2="362" />
    <!-- 6. 斜下管 -->
    <line x1="453.2" y1="491.4" x2="632" y2="362" />
    <!-- 7. 前叉与车头立管 (整根贯穿直管) -->
    <line x1="642" y1="267" x2="689.7" y2="491.4" />
  </g>

  <!-- ================= 7. 五通牙盘、曲柄与脚踏板 ================= -->
  <g id="crankAndPedal">
    <!-- 牙盘圆盘 -->
    <circle cx="453.2" cy="491.4" r="26" fill="#E8EEE4" stroke="#293E46" stroke-width="4.5" />
    <!-- 近侧曲柄 -->
    <line x1="453.2" y1="491.4" x2="496" y2="514" stroke="#293E46" stroke-width="6" stroke-linecap="round" />
    <!-- 脚踏板 -->
    <line x1="483" y1="518" x2="534" y2="518" stroke="#293E46" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- ================= 8. 车把手 (深色倒弯把) ================= -->
  <path d="M 640 274 Q 646 264 658 264 L 696 266 Q 709 268 708 293" 
        fill="none" stroke="#293E46" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- ================= 9. 鹈鹕主体：尾羽、躯干、颈部与翅膀 ================= -->
  <!-- 尾羽下方浅青灰阴影羽片 -->
  <path d="M 312 282.5 L 265 261.5 L 291 218.5 L 345.5 254 L 335.5 266 L 330.5 281 Z" fill="#E8EFEA" stroke="#293E46" stroke-width="3.5" stroke-linejoin="round" />

  <!-- 鹈鹕身体主外轮廓 (纯白羽毛，饱满端坐在上管上方) -->
  <path d="M 281.5 208 
           C 280 214 305 272 308 274 
           C 285 268 266 263 265 266 
           C 264 270 278 288 296 304 
           C 316 318 348 330 366 342 
           C 390 358 426 358 450 355 
           C 490 350 517 342 547 332 
           C 573 318 605 291 640 278 
           C 644 274 642 271 635 271 
           C 575 284 531 303 480 296 
           C 447 274 419 262 396 261 
           C 378 261 355 253 346 261 
           C 336 274 336 293 344 314 
           C 370 337 414 235 449 242 
           C 477 256 490 231 495 209 
           C 495 187 491 169 491 147 
           C 491 134 506 111 521 98 
           C 543 95 566 96 581 103 
           C 596 113 602 122 606 140 
           L 567 141 
           C 564 163 572 181 562 193 
           C 555 214 554 236 558 261 
           C 540 286 517 299 501 297 
           C 504 288 518 262 525 231 
           C 524 210 519 190 500 187 
           C 496 159 498 141 509 117 
           C 495 134 491 147 480 237 
           C 414 235 380 237 349 249 
           Z" 
        fill="#FFFDF6" stroke="#293E46" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 身体与腹部下方的浅青灰阴影层次 -->
  <path d="M 366 342 C 390 358 426 358 450 355 C 474 345 498 345 517 342 C 547 332 573 318 594 302 C 605 291 640 278 644 274 C 640 278 605 291 573 318 C 547 332 517 342 498 345 C 474 345 456 342 440 337 C 420 327 404 316 387 308 C 381 299 377 288 377 282 C 378 266 396 261 419 262 C 447 274 480 296 503 304 C 531 303 550 297 575 284 C 635 271 642 271 640 278 L 605 291 C 573 318 547 332 517 342 Z" fill="#E8EFEA" />

  <!-- 翅膀内部的羽毛装饰弧线 -->
  <g stroke="#293E46" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 382 266 Q 420 262 480 296" />
    <path d="M 407 292 Q 440 318 488 328" />
    <path d="M 420 334 Q 450 346 488 346" />
  </g>

  <!-- 颈部向前的羽毛分界弧线 -->
  <path d="M 521 98 Q 508 140 500 187" stroke="#293E46" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- ================= 10. 近处腿与脚 (亮暖橙色，跨在车架外侧) ================= -->
  <g id="nearLegAndFoot">
    <!-- 近处腿折线 -->
    <polyline points="462,347 422,417 498,489" fill="none" stroke="#F3AC47" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="462,347 422,417 498,489" fill="none" stroke="#293E46" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 鸟脚 (像一个小鸭蹼靴子踩在踏板上) -->
    <path d="M 498 488.5 L 491.5 507 L 498 518.5 L 542 518.5 L 549.5 513 L 525 506.5 L 514 494.5 Z" 
          fill="#F3AC47" stroke="#293E46" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
  </g>

  <!-- ================= 11. 鹈鹕标志性大嘴与喉囊 ================= -->
  <g id="pelicanBeak">
    <!-- 喉囊底部大兜子主轮廓 (明艳暖黄色 #FFBD59) -->
    <path d="M 567 141 
             L 785 160 
             C 770 185 730 226 638 226 
             C 590 226 574 190 565 165 
             Z" 
          fill="#FFBD59" stroke="#293E46" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 喉囊上部/内侧深暖橙色阴影 (#F79540) -->
    <path d="M 567 141 L 785 160 C 765 170 700 188 640 188 C 595 188 575 165 567 141 Z" fill="#F79540" />

    <!-- 上喙黑色横梁条 (从额前直到喙尖) -->
    <polygon points="565,140 786,159 785,166 565,148" fill="#293E46" />
    <!-- 嘴尖小倒钩/咬合点 -->
    <circle cx="785" cy="163" r="3.5" fill="#293E46" />

    <!-- 嘴部中间分界线 -->
    <path d="M 570 146 Q 660 156 780 162" fill="none" stroke="#293E46" stroke-width="2.5" />
  </g>

  <!-- ================= 12. 眼睛与头顶呆毛 ================= -->
  <!-- 眼睛 (圆溜溜呆萌眼神，正视前方) -->
  <g id="pelicanEye">
    <!-- 白色外眼眶 -->
    <circle cx="558.7" cy="135.7" r="16" fill="#FFFDF6" stroke="#293E46" stroke-width="3" />
    <!-- 暖黄色虹膜 -->
    <circle cx="558.7" cy="135.7" r="11" fill="#FFDC81" />
    <!-- 黑色圆瞳孔 -->
    <circle cx="558.7" cy="135.7" r="5.5" fill="#293E46" />
  </g>

  <!-- 头顶两根顽皮翘起的小呆毛 -->
  <g id="pelicanCrest" stroke="#293E46" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M 490 85 Q 500 70 522 68" />
    <path d="M 508 88 Q 520 80 540 82" />
  </g>
</svg>
